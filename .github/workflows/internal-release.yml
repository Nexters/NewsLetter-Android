name: Deploy Internal Tester

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version Code'
        required: true
      version_name:
        description: 'Version Name'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1

      - name: Install fastlane
        run: bundle install

      # 근데 local.properties는 왜 쓸데 없이 인코딩했었지?
      - name: Restore local files
        run: |
          echo "${{ secrets.LOCAL_PROPERTIES_64 }}" | base64 --decode > local.properties
          echo "${{ secrets.KEYSTORE_PROPERTIES }}" > keystore.properties
          echo "${{ secrets.RELEASE_KEYSTORE_64 }}" | base64 --decode > app/newsletter.jks
          echo '${{ secrets.SOAK_SERVICE_ACCOUNT_JSON }}' > fastlane/soak-service-account.json
          echo '${{ secrets.GOOGLE_SERVICES }}' > app/google-services.json

      - name: Deploy via Fastlane
        run: |
          set -o pipefail

          fastlane android deploy \
            version_code:${{ github.event.inputs.version_code }} \
            version_name:${{ github.event.inputs.version_name }} \
            2>&1 | tee fastlane.log

      - name: Notify to Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            MESSAGE="✅ 내부 테스트 완료!
          앱이 성공적으로 업로드되었습니다."
          else
            ERROR_LOG=$(grep -Ei "error|exception|failed|failure" fastlane.log 2>/dev/null \
              | tail -n 5 \
              | head -c 1500)

            if [ -z "$ERROR_LOG" ]; then
              ERROR_LOG=$(tail -n 10 fastlane.log 2>/dev/null | head -c 1500)
            fi

            MESSAGE="❌ 내부 테스트 배포 실패

          \`\`\`
          $ERROR_LOG
          \`\`\`"
          fi

          PAYLOAD=$(jq -n \
            --arg content "$MESSAGE" \
            --arg username "공주" \
            '{content: $content, username: $username}')

          curl -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
